# 시연용 정적 사이트(Render Static Site, 무료). hr-evaluation과 같은 방식: Private GitHub 저장소 → Render Blueprint.
# 프로토타입: 데이터는 Supabase(서버 DB)에 저장. 화면은 정적 사이트. 비밀 키는 쓰지 않음(공개 키만).
services:
  - type: web
    name: daeyang-hr-proto
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    # 프로토타입: Supabase 연결(공개 주소·공개 키 — 브라우저에 원래 들어가는 값). 비밀(secret/service_role) 키는 넣지 않는다
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://llvulnvmsihrlplczvmt.supabase.co
      - key: VITE_SUPABASE_KEY
        value: sb_publishable_ifiyB6LlFr3wlGmLn84IIg_FpoAG82B
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      # 화면 주소는 #/... 해시 방식 — 혹시 다른 경로로 들어와도 앱을 연다(직접 주소·새로고침)
      - type: rewrite
        source: /*
        destination: /index.html
